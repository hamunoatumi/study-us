<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>studyUs アバター最小構成</title>
    <script type="module" src="/src/avatar-minimal.js"></script>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f4f6ff;
      }

      main { width: min(90vw, 360px); text-align: center; }
      svg { display: block; width: 100%; height: auto; }
      video { position: absolute; width: 1px; height: 1px; opacity: 0; }
      button { padding: 10px 18px; cursor: pointer; }
      p { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <svg id="avatar"></svg>
      <button id="start-camera" type="button">カメラを開始</button>
      <p id="status">カメラは停止中です</p>
      <video id="camera" muted playsinline></video>
    </main>
  </body>
</html>
