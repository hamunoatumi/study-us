<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>studyUs アバタープレビュー</title>
    <script type="module" src="/src/avatar-preview.ts"></script>
  </head>
  <body>
    <main class="preview-shell">
      <section class="preview-copy">
        <span class="eyebrow">STUDYUS AVATAR LAB</span>
        <h1>あなたらしい<br />アバターを選ぼう。</h1>
        <p>今どきの男子高校生を意識した4種類を、同じカメラ入力で比較できます。</p>
        <button id="start-camera" type="button">全員をカメラで動かす</button>
        <p id="camera-status" class="camera-status">現在はニュートラル表示です</p>
      </section>
      <section id="avatar-gallery" class="avatar-gallery" aria-label="アバター一覧">
        <video id="camera" muted playsinline></video>
      </section>
    </main>
  </body>
</html>
