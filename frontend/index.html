<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyUs</title>
  </head>
  
  <body>
    <main class="flex min-h-screen items-center justify-center px-6">
      <section id="join-screen" class="w-full max-w-3xl">
        <header class="mb-10 text-center">
          <h1 class="text-3xl font-semibold tracking-tight text-gray-900">StudyUs</h1>
          <p class="mt-2 text-sm text-gray-500">一人じゃない</p>
        </header>

        <div class="rounded-2xl bg-white p-6">
          <label for="username" class="block text-sm font-medium text-gray-700">ユーザーネーム</label>

          <input id="username" type="text" placeholder="名前を入力" class="mt-2 w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm outline-none focus:border-gray-400"/>

          <button id="join-button" type="button" class="mt-4 w-full rounded-xl bg-gray-900 px-4 py-3 text-sm font-medium text-white hover:bg-gray-800">ルームに参加</button>

          <p class="mt-4 text-center text-xs leading-5 text-gray-400">
            カメラ映像が他の参加者に
            共有されることはありません
          </p>

          <div class="mt-5 border-t border-gray-100 pt-5 text-center">
            <a href="/extension-download.html" class="text-sm font-medium text-gray-600 underline decoration-gray-300 underline-offset-4 transition hover:text-gray-900">
              サボり検知用Chrome拡張機能を設定する
            </a>
          </div>
          <div class="mt-6 flex justify-center">
            <div class="fixed -left-[9999px] top-0 h-40 w-40">
              <svg id="local-avatar" class="h-full w-full"></svg>
            </div>
          </div>

          <video id="camera" autoplay playsinline muted class="hidden"></video>
        </div>
      </section>

      <!-- 参加中の画面 -->

      <section id="connected-screen" class="hidden w-full max-w-sm text-center">
        <h1  class="text-3xl font-semibold tracking-tight text-gray-900">StudyUs</h1>
        <p class="mt-3 text-sm text-gray-500">ルームに参加中</p>
        <p id="connected-username" class="mt-6 text-lg font-medium text-gray-900"></p>
        <button id="leave-button" type="button" class="mt-8 w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50">ルームから退出</button>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
