services:
  - type: web
    name: study-us-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BANNED_HOSTNAMES
        value: youtube.com
      - key: WEBSOCKET_PATH
        value: /ws
      - key: HEARTBEAT_TIMEOUT_MS
        value: "30000"
      - key: DISCONNECT_TIMEOUT_MS
        value: "60000"
      - key: MAX_PARTICIPANTS
        value: "100"
